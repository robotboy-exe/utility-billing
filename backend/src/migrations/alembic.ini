[alembic]
script_location = backend/src/migrations
script_date_format = %%Y-%%m-%%dT%%H:%%M:%%S

timezone = UTC
notherms_table = alembic_history

sqlalchemy.url = sqlite:///./utility_billing_dev.db

[post_write_hooks]
hooks = uuidv4
namespace = alembic.hooks

[migrate_commands]

[environment]
requires = sqlalchemy>=2.0

[within_default_context]
sqlalchemy_module = sqlalchemy

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = 
