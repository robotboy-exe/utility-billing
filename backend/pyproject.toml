[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
description = "Utility Billing Backend"
license = "MIT"
authors = [
    { name = "OpenSource", email = "opensource@example.com" }
]
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "Alembic>=1.13,<2.0",
    "psycopg[binary]>=3.0,<4.0",
    "tzdata>=2024.1",
    "pytest>=7.0,<9.0",
    "pytest-sqlalchemy>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "error::sqlalchemy.exc.SAWarning",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["backend.src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.alembic]
script_location = "backend.src.migrations"
version_path_separator = "_"
file_template = "%%{year:yy}%%{month:nn}%%{day:dd}_%%{rev}_%%{slug}"

[tools.sphinx]
extensions = []
